# Experimental runner. The experiment is MM_CONFIG, defaulting to the image's sample.
# The container opens no inbound ports and stores books only on the mounted data volume.

services:
  mm-model:
    build: .
    image: mm-model:latest
    user: "10001:10001"
    environment:
      MM_DATA_ROOT: /data
      MM_CONFIG: /app/configs/default.json
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
